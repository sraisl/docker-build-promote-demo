name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build:
    name: Build & Push Snapshot
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image-Repository ableiten
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY_OWNER,,}/foo-image" >> "$GITHUB_ENV"

      - name: Tags und OCI-Labels generieren
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=sha-${{ hashFiles('Dockerfile', '.dockerignore', 'app/**') }}
            type=raw,value=snapshot

      - name: Bei GHCR anmelden
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prüfen, ob Image für diesen Content-Hash existiert
        id: check
        if: github.event_name == 'push'
        uses: tyriis/docker-image-tag-exists@v2.1.0
        with:
          registry: ghcr.io
          repository: ${{ env.IMAGE_REPO }}
          tag: sha-${{ hashFiles('Dockerfile', '.dockerignore', 'app/**') }}

      - name: Buildx einrichten
        if: steps.check.outputs.tag != 'found'
        uses: docker/setup-buildx-action@v3

      - name: Image bauen (und auf main pushen)
        if: steps.check.outputs.tag != 'found'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Snapshot-Tag auf vorhandenes Image zeigen lassen
        if: github.event_name == 'push' && steps.check.outputs.tag == 'found'
        uses: akhilerm/tag-push-action@v2.1.0
        with:
          src: ghcr.io/${{ env.IMAGE_REPO }}:sha-${{ hashFiles('Dockerfile', '.dockerignore', 'app/**') }}
          dst: ghcr.io/${{ env.IMAGE_REPO }}:snapshot
